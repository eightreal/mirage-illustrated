t="700" fill="#172947" text-anchor="start">令 g = GELU(1) ≈ 0.8413，每个门控分量都等于 g。</text><text x="25" y="511" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#075d59" text-anchor="start">v ⊙ GELU(a) = [4g, 2g, 2g, 2g]ᵀ</text><text x="25" y="548" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172947" text-anchor="start">教学设定 Bₒ = I（4×4），乘完不改变列向量。</text><text x="25" y="583" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172947" text-anchor="start">再左乘 W⁻¹（4×4）：y = [5g, g, g, g]ᵀ</text><text x="25" y="610" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#455b7a" text-anchor="start">各列向量均为 4×1；这里只演示单位置的通道计算。</text></svg>