<svg xmlns="http://www.w3.org/2000/svg" width="900" height="555" viewBox="0 0 900 555" role="img" aria-labelledby="name desc"><title id="name">寄存 token：先读图像格，下层再读它</title><desc id="desc">两层示意：“安全帽格”和“桌面格”的信息可经一条临时寄存 token 传到下一层。</desc><defs><marker id="a" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#4f6d87"/></marker><style>text{fill:#14334e;font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}</style></defs>
<rect x="1" y="1" width="898" height="553" fill="#f4f8fc" stroke="#ceddec" rx="18" stroke-width="1.55"/>
<text x="27" y="48" font-size="29" font-weight="700">寄存 token：先读图像格，下层再读它</text>
<text x="28" y="81" font-size="17">两层示意：“安全帽格”和“桌面格”的信息可经一条临时寄存 token 传到下一层。</text>
<text x="26" y="131" font-size="17" font-weight="700">第 0 层状态</text>
<text x="26" y="267" font-size="17" font-weight="700">第 1 层状态</text>
<text x="26" y="411" font-size="17" font-weight="700">第 2 层状态</text>
<rect x="177" y="108" width="175" height="64" fill="#e7f7f1" stroke="#147665" rx="9" stroke-width="1.55"/>
<text x="264.5" y="135" font-size="19" font-weight="700" text-anchor="middle">安全帽格</text>
<text x="264.5" y="159" font-size="15" text-anchor="middle">H⁽⁰⁾</text>
<rect x="380" y="108" width="158" height="64" fill="#f1eafe" stroke="#704a9f" rx="9" stroke-width="1.55"/>
<text x="459.0" y="135" font-size="19" font-weight="700" text-anchor="middle">寄存 token</text>
<text x="459.0" y="159" font-size="15" text-anchor="middle">R⁽⁰⁾</text>
<rect x="570" y="108" width="178" height="64" fill="#e7f7f1" stroke="#147665" rx="9" stroke-width="1.55"/>
<text x="659.0" y="135" font-size="19" font-weight="700" text-anchor="middle">桌面格</text>
<text x="659.0" y="159" font-size="15" text-anchor="middle">T⁽⁰⁾</text>
<polyline points="457,178 457,227" fill="none" stroke="#4f6d87" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="265,177 265,204 403,204 403,228" fill="none" stroke="#4f6d87" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="659,177 659,204 514,204 514,228" fill="none" stroke="#4f6d87" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="270" y="198" font-size="14">K/V</text>
<text x="638" y="198" font-size="14">K/V</text>
<text x="468" y="208" font-size="14">Q</text>
<rect x="379" y="235" width="159" height="68" fill="#f1eafe" stroke="#704a9f" rx="9" stroke-width="1.55"/>
<text x="458.5" y="262" font-size="19" font-weight="700" text-anchor="middle">R⁽¹⁾ 更新</text>
<text x="458.5" y="286" font-size="15" text-anchor="middle">可汇入帽子与桌面</text>
<rect x="147" y="235" width="174" height="68" fill="#e7f7f1" stroke="#147665" rx="9" stroke-width="1.55"/>
<text x="234.0" y="262" font-size="19" font-weight="700" text-anchor="middle">H⁽¹⁾ 更新</text>
<text x="234.0" y="286" font-size="15" text-anchor="middle">保留图像格路径</text>
<polyline points="178,177 126,177 126,267 139,267" fill="none" stroke="#4f6d87" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="236,308 236,371" fill="none" stroke="#4f6d87" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="456,308 456,340 312,340 312,371" fill="none" stroke="#4f6d87" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="242" y="350" font-size="14">Q</text>
<text x="380" y="333" font-size="14">K/V</text>
<rect x="146" y="379" width="190" height="71" fill="#fff1d9" stroke="#9b510b" rx="9" stroke-width="1.55"/>
<text x="241.0" y="406" font-size="19" font-weight="700" text-anchor="middle">H⁽²⁾ 再更新</text>
<text x="241.0" y="430" font-size="15" text-anchor="middle">可以读取 R⁽¹⁾</text>
<rect x="559" y="378" width="307" height="72" fill="#eaf3ff" stroke="#2562a2" rx="9" stroke-width="1.55"/>
<text x="712.5" y="405" font-size="19" font-weight="700" text-anchor="middle">完整 12 层后只保留图像格</text>
<text x="712.5" y="429" font-size="15" text-anchor="middle">四个 R 不进入粗图 E</text>
<polyline points="343,414 550,414" fill="none" stroke="#4f6d87" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="576" y="243" font-size="16" font-weight="700">第 1 层：R⁽⁰⁾ 的 Q</text>
<text x="576" y="270" font-size="16">读第 0 层图像格的 K/V。</text>
<text x="576" y="311" font-size="16" font-weight="700">第 2 层：H⁽¹⁾ 的 Q</text>
<text x="576" y="338" font-size="16">才可能读到更新后的 R⁽¹⁾。</text>
<text x="27" y="535" font-size="15">同一层读取的是上一层状态，不能读本层刚更新的 R；图像格也可直接互读。</text>
</svg>