stroke="#a5bfd6" /><text x="256" y="134" font-size="19" font-weight="700" fill="#14304b">与其他卷积核一起训练</text><path d="M471 127 L518 127" stroke="#426582" stroke-width="2.3" fill="none" marker-end="url(#a)"/><rect x="530" y="102" width="264" height="52" rx="13" fill="#e7f6f3" stroke="#a5cbc1" /><text x="558" y="134" font-size="19" font-weight="700" fill="#14304b">推理仍是普通卷积</text><text x="234" y="181" font-size="17" font-weight="400" fill="#14304b">仅选定卷积层的一半输出滤波器使用这一初值，不冻结。</text><text x="40" y="255" font-size="22" font-weight="700" fill="#14304b">部署 · 不是每个权重都压到 2 bit</text><rect x="40" y="271" width="289" height="66" rx="13" fill="#e7f0fa" stroke="#a5bfd6" /><text x="56" y="297" font-size="22" font-weight="700" fill="#14304b">2 bit</text><text x="56" y="320" font-size="17" font-weight="400" fill="#14304b">大多数量化矩阵</text><rect x="347" y="271" width="306" height="66" rx="13" fill="#f1e9fa" stroke="#bcabd5" /><text x="363" y="297" font-size="22" font-weight="700" fill="#14304b">4 bit</text><text x="363" y="320" font-size="17" font-weight="400" fill="#14304b">token embedding / mHC 路由</text><rect x="671" y="271" width="325" height="66" rx="13" fill="#e7f6f3" stroke="#a5cbc1" /><text x="687" y="297" font-size="22" font-weight="700" fill="#14304b">FP16</text><text x="687" y="320" font-size="17" font-weight="400" fill="#14304b">HConvGLU 带状权重</text><text x="40" y="360" font-size="17" font-weight="400" fill="#14304b">以上按权重类别列示，不表示占比；另有其他浮点张量。</text><text x="40" y="416" font-size="22" font-weight="700" fill="#14304b">推理 · 表单只能在给定选项和弃答里做选择</text><rect x="40" y="436" width="246" height="51" rx="13" fill="#fbefdf" stroke="#dbc6a8" /><text x="55" y="467" font-size="18" font-weight="700" fill="#14304b">安全帽／其他／弃答</text><path d="M295 462 L327 462" stroke="#426582" stroke-width="2.3" fill="none" marker-end="url(#a)"/><rect x="337" y="436" width="283" height="51" rx="13" fill="#e7f0fa" stroke="#a5bfd6" /><text x="355" y="467" font-size="18" font-weight="700" fill="#14304b">逐候选：token ＋ 终止符</text><path d="M629 462 L662 462" stroke="#426582" stroke-width="2.3" fill="none" marker-end="url(#a)"/><rect x="672" y="436" width="324" height="51" rx="13" fill="#e7f6f3" stroke="#a5cbc1" /><text x="694" y="467" font-size="18" font-weight="700" fill="#14304b">累加 log 概率，同组选项比较</text><text x="40" y="513" font-size="17" font-weight="400" fill="#14304b">候选内分数不等于真实正确率；表单路径不跑 OCR。</text></g></svg>