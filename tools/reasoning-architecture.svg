<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 830" width="720" height="830" role="img" aria-labelledby="title desc"><title id="title">Mirage Reasoning 模型图</title><desc id="desc">E、D 与候选框 B 生成区域槽和视觉记忆 M，八层解码器逐 token 生成短解释；候选框、分割掩码、OCR 各自由空间支路产生，直到运行时才与语义输出汇合。</desc>
<defs><marker id="arr" markerWidth="7" markerHeight="7" viewBox="0 0 8 8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#56738a"/></marker><style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#16344e}.d{fill:#fff;stroke:#177969}.m{fill:#e5f0fe;stroke:#225f9b}.o{fill:#fff0de;stroke:#a35612}.wire{fill:none;stroke:#56738a;stroke-width:2.4;stroke-linejoin:round;marker-end:url(#arr)}</style></defs>
<rect x="1" y="1" width="718" height="828" rx="18" fill="#f4f8fc" stroke="#cadcec"/>
<text x="26" y="34" font-size="15" font-weight="700">MIRAGE  /  REASONING ARCHITECTURE</text>
<text x="25" y="75" font-size="29" font-weight="700">模型生成语义；其余信号独立计算</text>
<text x="25" y="105" font-size="18">箭头表示数据依赖，不表示原生引擎的具体调度。</text>
<rect x="27" y="137" width="175" height="65" rx="10" class="d" stroke-width="1.6"/>
<text x="114.5" y="164" font-size="21" text-anchor="middle" font-weight="700">E：粗图</text>
<text x="114.5" y="189" font-size="17" text-anchor="middle">16² × 512</text>
<rect x="227" y="137" width="175" height="65" rx="10" class="d" stroke-width="1.6"/>
<text x="314.5" y="164" font-size="21" text-anchor="middle" font-weight="700">D：细图</text>
<text x="314.5" y="189" font-size="17" text-anchor="middle">64² × 128</text>
<rect x="453" y="137" width="239" height="65" rx="10" class="m" stroke-width="1.6"/>
<text x="572.5" y="164" font-size="21" text-anchor="middle" font-weight="700">物体／文字检测头</text>
<text x="572.5" y="189" font-size="17" text-anchor="middle">读取 D，产生候选 B</text>
<path d="M402 169H447" class="wire"/>
<rect x="453" y="240" width="239" height="65" rx="10" class="d" stroke-width="1.6"/>
<text x="572.5" y="267" font-size="21" text-anchor="middle" font-weight="700">B：候选框</text>
<text x="572.5" y="292" font-size="17" text-anchor="middle">Bobj 与 Btext</text>
<path d="M573 205V234" class="wire"/>
<rect x="27" y="266" width="373" height="65" rx="10" class="m" stroke-width="1.6"/>
<text x="213.5" y="293" font-size="21" text-anchor="middle" font-weight="700">区域槽：从 E、D 和 B 构建</text>
<text x="213.5" y="318" font-size="17" text-anchor="middle">中心取样＋坐标编码＋框内池化</text>
<path d="M114 204V258" class="wire"/>
<path d="M314 204V258" class="wire"/>
<path d="M450 271H406" class="wire"/>
<rect x="27" y="369" width="373" height="65" rx="10" class="d" stroke-width="1.6"/>
<text x="213.5" y="396" font-size="21" text-anchor="middle" font-weight="700">视觉记忆 M</text>
<text x="213.5" y="421" font-size="17" text-anchor="middle">E 网格 ＋ 512 维区域槽</text>
<path d="M212 333V363" class="wire"/>
<path d="M26 169H14V402H24" class="wire"/>
<rect x="27" y="479" width="373" height="65" rx="10" class="m" stroke-width="1.6"/>
<text x="213.5" y="506" font-size="21" text-anchor="middle" font-weight="700">8 层语义解码器</text>
<text x="213.5" y="531" font-size="17" text-anchor="middle">读 M 与此前 token，预测下一 token</text>
<path d="M212 436V473" class="wire"/>
<rect x="27" y="587" width="373" height="70" rx="10" class="o" stroke-width="1.6"/>
