<text x="537.0" y="284.0" font-size="19" font-weight="700" text-anchor="middle">−0.02</text>
<polyline points="596,277 647,277 647,229 671,229" fill="none" stroke="#4f6d87" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="678" y="179" width="187" height="73" fill="#fff1d9" stroke="#9b510b" rx="9" stroke-width="1.55"/>
