<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="name desc"><title id="name">同一网格、同一通道，按层加权相加</title><desc id="desc">玩具例：取同一张安全帽图上的位置 p，通道编号 37；不增加 token。</desc><defs><marker id="a" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#4f6d87"/></marker><style>text{fill:#14334e;font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}</style></defs>
<rect x="1" y="1" width="898" height="378" fill="#f4f8fc" stroke="#ceddec" rx="18" stroke-width="1.55"/>
<text x="27" y="48" font-size="29" font-weight="700">同一网格、同一通道，按层加权相加</text>
<text x="28" y="81" font-size="17">玩具例：取同一张安全帽图上的位置 p，通道编号 37；不增加 token。</text>
