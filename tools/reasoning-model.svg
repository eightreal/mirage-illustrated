<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 650" width="700" height="650" role="img" aria-labelledby="title about">
<title id="title">Mirage describe 的参数和输出字典</title>
<desc id="about">options 与 conf 合并后编码为请求 JSON；language 和 keywords 单独编码为 UTF-8 并映射到 C ABI 的两个独立参数。原生引擎返回 UTF-8 JSON，包装层解析成 Python 字典，可按键取 reasoning。</desc>
<defs><marker id="a" viewBox="0 0 8 8" markerWidth="6" markerHeight="6" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#537089"/></marker>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173550}.h{font-weight:700;font-size:24px}.small{font-size:18px}.code{font-family:monospace;font-size:17px}.arrow{fill:none;stroke:#537089;stroke-width:2.4;marker-end:url(#a)}.input{fill:#fff;stroke:#55748d;stroke-width:1.5}.wire{fill:#e6f0ff;stroke:#2362a0;stroke-width:1.5}.result{fill:#edf8f2;stroke:#197665;stroke-width:1.5}</style></defs>
<rect x="1" y="1" width="698" height="648" rx="22" fill="#f3f7fc" stroke="#ccdfef"/>
<text x="25" y="38" font-size="16" font-weight="700">MIRAGE SDK · DESCRIBE</text>
<text x="25" y="77" font-size="31" font-weight="700">两个传参路径，一个结果字典</text>
<text x="25" y="108" class="small">图中只展开选项、语言和关键词；图片 RGB 另传。</text>
<rect x="27" y="135" width="320" height="87" rx="10" class="input"/>
<text x="43" y="163" class="h">请求选项 · 字典键</text>
<text x="43" y="192" class="code">options={"sections": …}</text>
<text x="43" y="213" class="code">conf=0.35</text>
<rect x="365" y="135" width="309" height="87" rx="10" class="input"/>
<text x="381" y="163" class="h">显式参数 · 单独传递</text>
<text x="381" y="192" class="code">language="en"</text>
<text x="381" y="213" class="code">keywords=["helmet", "vest"]</text>
<path d="M187 224V249" class="arrow"/><path d="M520 224V249" class="arrow"/>
<rect x="27" y="255" width="320" height="83" rx="10" class="wire"/>
<text x="43" y="284" class="h">合并 → UTF-8 JSON</text>
<text x="43" y="316" class="small">重名报错，不覆盖</text>
<rect x="365" y="255" width="309" height="83" rx="10" class="wire"/>
<text x="381" y="284" class="h">两项各自编码</text>
<text x="381" y="315" class="code">b"en" · b"helmet\nvest"</text>
<path d="M187 340V369" class="arrow"/><path d="M520 340V369" class="arrow"/>
<rect x="27" y="376" width="647" height="74" rx="10" class="wire"/>
<text x="350" y="408" text-anchor="middle" class="h">C ABI · cactus_describe</text>
<text x="350" y="434" text-anchor="middle" class="small">原生引擎接收不同的参数，输出 UTF-8 JSON</text>
<path d="M350 452V478" class="arrow"/>
<rect x="27" y="485" width="647" height="83" rx="10" class="result"/>
<text x="350" y="516" text-anchor="middle" class="h">Python 解析成结果字典</text>
<text x="350" y="546" text-anchor="middle" class="code">result.get("reasoning")</text>
<text x="27" y="608" class="small">明确的是 SDK 传输方式；它不证明原生引擎如何用关键词。</text>
<text x="27" y="633" class="small">reasoning 是生成的返回字段，不是输入参数、开关或计算日志。</text>
</svg>
