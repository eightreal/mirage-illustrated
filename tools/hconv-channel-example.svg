<svg xmlns="http://www.w3.org/2000/svg" width="900" height="445" viewBox="0 0 900 445" role="img" aria-labelledby="name desc"><title id="name">在一个位置混合通道：4 维 Walsh 手算</title><desc id="desc">教学简化：W 用 4 维 sequency 顺序并除以 2；B_g＝0.5I，B_o＝I，b＝0。</desc><defs><marker id="a" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#4f6d87"/></marker><style>text{fill:#14334e;font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}</style></defs>
<rect x="1" y="1" width="898" height="443" fill="#f4f8fc" stroke="#ceddec" rx="18" stroke-width="1.55"/>
<text x="27" y="48" font-size="29" font-weight="700">在一个位置混合通道：4 维 Walsh 手算</text>
<text x="28" y="81" font-size="17">教学简化：W 用 4 维 sequency 顺序并除以 2；B_g＝0.5I，B_o＝I，b＝0。</text>
<rect x="28" y="137" width="192" height="71" fill="#e7f7f1" stroke="#147665" rx="9" stroke-width="1.55"/>
<text x="124.0" y="164" font-size="19" font-weight="700" text-anchor="middle">原通道 x</text>
<text x="124.0" y="188" font-size="15" text-anchor="middle">[4, 0, 0, 0]</text>
<polyline points="225,173 259,173" fill="none" stroke="#4f6d87" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="267" y="137" width="207" height="71" fill="#eaf3ff" stroke="#2562a2" rx="9" stroke-width="1.55"/>
<text x="370.5" y="164" font-size="19" font-weight="700" text-anchor="middle">固定 Walsh → u</text>
<text x="370.5" y="188" font-size="15" text-anchor="middle">[2, 2, 2, 2]</text>
<polyline points="480,173 500,173 500,129 518,129" fill="none" stroke="#4f6d87" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="500,173 500,222 518,222" fill="none" stroke="#4f6d87" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="526" y="99" width="325" height="65" fill="#f1eafe" stroke="#704a9f" rx="9" stroke-width="1.55"/>
<text x="688.5" y="126" font-size="19" font-weight="700" text-anchor="middle">门支 g = GELU(0.5u)</text>
<text x="688.5" y="150" font-size="15" text-anchor="middle">≈ [0.8413, 0.8413, 0.8413, 0.8413]</text>
<rect x="526" y="191" width="325" height="65" fill="#e7f7f1" stroke="#147665" rx="9" stroke-width="1.55"/>
<text x="688.5" y="218" font-size="19" font-weight="700" text-anchor="middle">值支 B_v：仅 v₀ 多一个邻接项</text>
<text x="688.5" y="242" font-size="15" text-anchor="middle">v₀=u₀+u₁；v=[4, 2, 2, 2]</text>
<polyline points="850,131 869,131 869,287 686,287 686,304" fill="none" stroke="#4f6d87" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="683,260 683,269 616,269 616,304" fill="none" stroke="#4f6d87" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="507" y="311" width="252" height="68" fill="#fff1d9" stroke="#9b510b" rx="9" stroke-width="1.55"/>
<text x="633.0" y="338" font-size="19" font-weight="700" text-anchor="middle">逐元素乘 g ⊙ v</text>
<text x="633.0" y="362" font-size="15" text-anchor="middle">≈ [3.3654, 1.6827, 1.6827, 1.6827]</text>
<polyline points="508,345 479,345" fill="none" stroke="#4f6d87" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="225" y="311" width="245" height="68" fill="#eaf3ff" stroke="#2562a2" rx="9" stroke-width="1.55"/>
<text x="347.5" y="338" font-size="19" font-weight="700" text-anchor="middle">B_o 后做逆 Walsh</text>
<text x="347.5" y="362" font-size="15" text-anchor="middle">≈ [4.2067, 0.8413, 0.8413, 0.8413]</text>
<text x="30" y="240" font-size="16">W 的四行首项都是 ½，</text>
<text x="30" y="266" font-size="16">每行都得到 4×½＝2。</text>
<text x="27" y="425" font-size="15">乘法使用未舍入门值；真正网络使用 512 通道、每条带宽 65。该位置不读取邻近图像格。</text>
</svg>