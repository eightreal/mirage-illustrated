<svg xmlns="http://www.w3.org/2000/svg" width="720" height="818" viewBox="0 0 720 818" role="img" aria-labelledby="title desc"><title id="title">HConvGLU 在 Mirage 的接线、三张带与每段向量形状</title><desc id="desc">Body 的第二残差支路和 Attention 做完注意力后的通道支路各自使用 HConvGLU。固定蝶形 Walsh 后，值和门分别走可学习带状映射，逐元素相乘再走第三张带；固定逆 Walsh 后输出。每一步向量都是512维，512乘65只指各带的权重存储。</desc><defs><style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#41627e"/></marker></defs><rect x="0" y="0" width="720" height="818" rx="0" fill="#f4f8fc" stroke="none" stroke-width="1.6"/><text x="23" y="38" font-size="29" fill="#152d45" font-weight="760" text-anchor="start">HConvGLU：用在哪里，512 又怎么变？</text><rect x="24" y="62" width="325" height="128" rx="10" fill="#fff" stroke="#c6d7e8" stroke-width="1.6"/><text x="37" y="91" font-size="20" fill="#152d45" font-weight="730" text-anchor="start">① Body ×16 · 第二残差支路</text><text x="37" y="118" font-size="17" fill="#41627e" font-weight="480" text-anchor="start">空间门控加回后 → 归一化</text><text x="37" y="143" font-size="17" fill="#962344" font-weight="650" text-anchor="start">→ HConvGLU → GRN / 掩码</text><text x="37" y="168" font-size="17" fill="#41627e" font-weight="480" text-anchor="start">→ 加回；每个图像格分别算</text><rect x="371" y="62" width="325" height="128" rx="10" fill="#fff" stroke="#c6d7e8" stroke-width="1.6"/><text x="384" y="91" font-size="20" fill="#152d45" font-weight="730" text-anchor="start">② Attention ×12 · 通道支路</text><text x="384" y="118" font-size="17" fill="#41627e" font-weight="480" text-anchor="start">注意力加回后 → 归一化</text><text x="384" y="143" font-size="17" fill="#962344" font-weight="650" text-anchor="start">→ HConvGLU → 掩码并加回</text><text x="384" y="168" font-size="17" fill="#41627e" font-weight="480" text-anchor="start">每个 token 分别算，不是 Q/K/V</text><text x="360" y="222" font-size="22" fill="#152d45" font-weight="720" text-anchor="middle">任取一处的单格 / 单 token：所有中间激活都是 512 维</text><rect x="94" y="240" width="532" height="61" rx="8" fill="#e9f4fd" stroke="#22588b" stroke-width="1.6"/><text x="360.0" y="265" font-size="21" fill="#152d45" font-weight="720" text-anchor="middle">x (512) → 固定 Walsh W → u (512)</text><text x="360.0" y="289" font-size="17" fill="#41627e" font-weight="500" text-anchor="middle">逻辑 W：512×512；实际用蝶形加减，不学权重</text><polyline points="360,301 360,316 184,316 184,333" fill="none" stroke="#41627e" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="360,316 536,316 536,333" fill="none" stroke="#41627e" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="26" y="337" width="316" height="100" rx="8" fill="#f3ecff" stroke="#7452a0" stroke-width="1.6"/><text x="184" y="364" font-size="21" fill="#152d45" font-weight="720" text-anchor="middle">Bᵥ：u (512) → v (512)</text><text x="184" y="391" font-size="17" fill="#41627e" font-weight="500" text-anchor="middle">逻辑 512×512；紧凑存 512×65</text><text x="184" y="419" font-size="16" fill="#7452a0" font-weight="600" text-anchor="middle">值支路，无额外偏置</text><rect x="378" y="337" width="316" height="100" rx="8" fill="#f3ecff" stroke="#7452a0" stroke-width="1.6"/><text x="536" y="364" font-size="21" fill="#152d45" font-weight="720" text-anchor="middle">Bɢ：u (512) → a (512)</text><text x="536" y="391" font-size="17" fill="#41627e" font-weight="500" text-anchor="middle">逻辑 512×512；紧凑存 512×65</text><text x="536" y="419" font-size="16" fill="#7452a0" font-weight="600" text-anchor="middle">门控支路，加偏置 b (512)</text><polyline points="184,438 184,460 291,460 291,478" fill="none" stroke="#41627e" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="536,438 536,460 430,460 430,478" fill="none" stroke="#41627e" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="105" y="483" width="510" height="63" rx="8" fill="#fff2de" stroke="#a76d20" stroke-width="1.6"/><text x="360.0" y="508" font-size="21" fill="#152d45" font-weight="720" text-anchor="middle">GLU：z = v ⊙ GELU(a)；z (512)</text><text x="360.0" y="532" font-size="17" fill="#41627e" font-weight="500" text-anchor="middle">两条 512 维向量逐元素相乘，不拼接</text><polyline points="360,546 360,563" fill="none" stroke="#41627e" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="105" y="568" width="510" height="62" rx="8" fill="#f3ecff" stroke="#7452a0" stroke-width="1.6"/><text x="360.0" y="593" font-size="21" fill="#152d45" font-weight="720" text-anchor="middle">Bₒ：z (512) → t (512)</text><text x="360.0" y="617" font-size="17" fill="#41627e" font-weight="500" text-anchor="middle">逻辑 512×512；紧凑存 512×65</text><polyline points="360,630 360,647" fill="none" stroke="#41627e" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="105" y="652" width="510" height="62" rx="8" fill="#e9f4fd" stroke="#22588b" stroke-width="1.6"/><text x="360.0" y="677" font-size="21" fill="#152d45" font-weight="720" text-anchor="middle">t (512) → 固定逆 Walsh W⁻¹ → y (512)</text><text x="360.0" y="701" font-size="17" fill="#41627e" font-weight="500" text-anchor="middle">再次用固定蝶形；输出仍为 512 维</text><rect x="24" y="734" width="672" height="64" rx="8" fill="#fff" stroke="#b6cbe1" stroke-width="1.6"/><text x="360" y="761" font-size="19" fill="#152d45" font-weight="720" text-anchor="middle">蝶形只属于 W / W⁻¹；三张 B 是学习到的带状乘法。</text><text x="360" y="787" font-size="18" fill="#962344" font-weight="650" text-anchor="middle">65 是每行存储宽度，不是激活维度、不是网格位置数。</text></svg>
