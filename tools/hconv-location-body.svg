<svg xmlns="http://www.w3.org/2000/svg" width="1162" height="416" viewBox="14 1072 1162 416" font-family="Noto Sans CJK SC, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">放大一个 Body Block：HConvGLU 在第二条残差支路</title><desc id="desc">空间门控及首次残差后，第二支路使用 RMSNorm、HConvGLU、GRN 与掩码，再加回。HConvGLU 固定每格，Walsh 换基后经过三张带状权重并逆变换。</desc><defs><marker id="locarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#58708e"/></marker></defs><rect x="24" y="1078" width="1142" height="403" rx="17" fill="#ffffff" stroke="#d5dfea" stroke-width="2"/><circle cx="53" cy="1110" r="14" fill="#b82438" stroke="white" stroke-width="2"/><text x="53" y="1115" font-size="15" style="fill:white" font-weight="700" text-anchor="middle">1</text><text x="79" y="1118" font-size="24" style="fill:#172941" font-weight="750" text-anchor="start">放大一个 Body：红框是第二条残差支路里的通道混合</text><rect x="50" y="1145" width="230" height="79" rx="11" fill="#eff5fd" stroke="#c4d8eb" stroke-width="1.4"/><text x="165.0" y="1177" font-size="20" style="fill:#172941" font-weight="720" text-anchor="middle">空间门控 + 第一次残差</text><text x="165.0" y="1207" font-size="17" style="fill:#425b79" font-weight="500" text-anchor="middle">16 × 16 × 512</text><rect x="318" y="1145" width="138" height="79" rx="11" fill="#eff5fd" stroke="#c4d8eb" stroke-width="1.4"/><text x="387.0" y="1177" font-size="20" style="fill:#172941" font-weight="720" text-anchor="middle">RMSNorm</text><text x="387.0" y="1207" font-size="17" style="fill:#425b79" font-weight="500" text-anchor="middle">形状不变</text><rect x="495" y="1145" width="216" height="79" rx="11" fill="#fff1f2" stroke="#b82438" stroke-width="3"/><text x="603.0" y="1177" font-size="20" style="fill:#a21d32" font-weight="720" text-anchor="middle">HConvGLU</text><text x="603.0" y="1207" font-size="17" style="fill:#425b79" font-weight="500" text-anchor="middle">每格取 1 个 512 向量</text><rect x="750" y="1145" width="167" height="79" rx="11" fill="#eff5fd" stroke="#c4d8eb" stroke-width="1.4"/><text x="833.5" y="1177" font-size="20" style="fill:#172941" font-weight="720" text-anchor="middle">GRN + 掩码</text><text x="833.5" y="1207" font-size="17" style="fill:#425b79" font-weight="500" text-anchor="middle">形状不变</text><rect x="956" y="1145" width="182" height="79" rx="11" fill="#eff5fd" stroke="#c4d8eb" stroke-width="1.4"/><text x="1047.0" y="1177" font-size="20" style="fill:#172941" font-weight="720" text-anchor="middle">第二次残差加回</text><text x="1047.0" y="1207" font-size="17" style="fill:#425b79" font-weight="500" text-anchor="middle">16 × 16 × 512</text><path d="M282 1187H313" stroke="#58708e" stroke-width="2.5" marker-end="url(#locarr)"/><path d="M458 1187H490" stroke="#58708e" stroke-width="2.5" marker-end="url(#locarr)"/><path d="M713 1187H745" stroke="#58708e" stroke-width="2.5" marker-end="url(#locarr)"/><path d="M919 1187H951" stroke="#58708e" stroke-width="2.5" marker-end="url(#locarr)"/><path d="M300 1187V1134H1047V1141" fill="none" stroke="#58708e" stroke-dasharray="5 5" stroke-width="1.7" marker-end="url(#locarr)"/><text x="50" y="1267" font-size="21" style="fill:#a21d32" font-weight="740" text-anchor="start">红框内部：只看同一个网格位置</text><rect x="50" y="1292" width="138" height="84" rx="11" fill="#e9f6ef" stroke="#c9d7e6" stroke-width="1.5"/><text x="119.0" y="1326" font-size="22" style="fill:#172941" font-weight="740" text-anchor="middle">x</text><text x="119.0" y="1357" font-size="18" style="fill:#425b79" font-weight="500" text-anchor="middle">512 维输入</text><rect x="226" y="1292" width="135" height="84" rx="11" fill="#eef3ff" stroke="#c9d7e6" stroke-width="1.5"/><text x="293.5" y="1326" font-size="22" style="fill:#172941" font-weight="740" text-anchor="middle">Walsh</text><text x="293.5" y="1357" font-size="18" style="fill:#425b79" font-weight="500" text-anchor="middle">固定变换</text><rect x="399" y="1292" width="112" height="84" rx="11" fill="#e9f6ef" stroke="#c9d7e6" stroke-width="1.5"/><text x="455.0" y="1326" font-size="22" style="fill:#172941" font-weight="740" text-anchor="middle">u</text><text x="455.0" y="1357" font-size="18" style="fill:#425b79" font-weight="500" text-anchor="middle">512 维</text><rect x="548" y="1292" width="350" height="84" rx="11" fill="#fff2e8" stroke="#c9d7e6" stroke-width="1.5"/><text x="723.0" y="1326" font-size="22" style="fill:#172941" font-weight="740" text-anchor="middle">三张 512 × 65 权重表</text><text x="723.0" y="1357" font-size="18" style="fill:#425b79" font-weight="500" text-anchor="middle">值路 / 门控路逐元素相乘 → 输出路</text><rect x="935" y="1292" width="203" height="84" rx="11" fill="#eef3ff" stroke="#c9d7e6" stroke-width="1.5"/><text x="1036.5" y="1326" font-size="22" style="fill:#172941" font-weight="740" text-anchor="middle">逆 Walsh</text><text x="1036.5" y="1357" font-size="18" style="fill:#425b79" font-weight="500" text-anchor="middle">输出 y：512 维</text><path d="M190 1336H222" stroke="#58708e" stroke-width="2.5" marker-end="url(#locarr)"/><path d="M363 1336H395" stroke="#58708e" stroke-width="2.5" marker-end="url(#locarr)"/><path d="M513 1336H544" stroke="#58708e" stroke-width="2.5" marker-end="url(#locarr)"/><path d="M900 1336H931" stroke="#58708e" stroke-width="2.5" marker-end="url(#locarr)"/><text x="50" y="1424" font-size="21" style="fill:#172941" font-weight="650" text-anchor="start">65 选的是 Walsh 坐标：左 32 + 自己 1 + 右 32；不是图片上的 65 个位置。</text><text x="50" y="1456" font-size="19" style="fill:#425b79" font-weight="500" text-anchor="start">HConvGLU 对每格各算一遍；跨网格位置混合的是空间门控或 Attention。</text></svg>