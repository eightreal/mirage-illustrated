<svg xmlns="http://www.w3.org/2000/svg" width="900" height="443" viewBox="0 0 900 443" role="img" aria-labelledby="name desc"><title id="name">两个通道：先换一种坐标，再调强弱</title><desc id="desc">教学示意：同一个图像格里的两个数。只演示换基，不是完整的 HConvGLU。</desc><defs><marker id="a" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#4f6d87"/></marker><style>text{fill:#14334e;font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}</style></defs>
<rect x="1" y="1" width="898" height="441" fill="#f4f8fc" stroke="#ceddec" rx="18" stroke-width="1.55"/>
<text x="27" y="48" font-size="29" font-weight="700">两个通道：先换一种坐标，再调强弱</text>
<text x="28" y="81" font-size="17">教学示意：同一个图像格里的两个数。只演示换基，不是完整的 HConvGLU。</text>
<rect x="33" y="130" width="180" height="72" fill="#e7f7f1" stroke="#147665" rx="9" stroke-width="1.55"/>
<text x="123.0" y="157" font-size="19" font-weight="700" text-anchor="middle">原始通道</text>
<text x="123.0" y="181" font-size="15" text-anchor="middle">x = [6, 2]</text>
<polyline points="218,165 263,165" fill="none" stroke="#4f6d87" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="271" y="117" width="246" height="99" fill="#eaf3ff" stroke="#2562a2" rx="9" stroke-width="1.55"/>
<text x="394.0" y="144" font-size="19" font-weight="700" text-anchor="middle">换到“和、差”坐标</text>
<text x="394.0" y="168" font-size="15" text-anchor="middle">W x = [8/√2, 4/√2]</text>
<polyline points="524,166 561,166" fill="none" stroke="#4f6d87" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="569" y="117" width="288" height="99" fill="#f1eafe" stroke="#704a9f" rx="9" stroke-width="1.55"/>
<text x="713.0" y="144" font-size="19" font-weight="700" text-anchor="middle">保留和，差减半</text>
<text x="713.0" y="168" font-size="15" text-anchor="middle">[8/√2, 2/√2]</text>
<polyline points="713,221 713,256" fill="none" stroke="#4f6d87" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="569" y="262" width="288" height="73" fill="#fff1d9" stroke="#9b510b" rx="9" stroke-width="1.55"/>
<text x="713.0" y="289" font-size="19" font-weight="700" text-anchor="middle">换回原始通道</text>
<text x="713.0" y="313" font-size="15" text-anchor="middle">W⁻¹ → [5, 3]</text>
<polyline points="123,207 123,257" fill="none" stroke="#4f6d87" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="33" y="264" width="451" height="72" fill="#eaf3ff" stroke="#2562a2" rx="9" stroke-width="1.55"/>
<text x="258.5" y="291" font-size="19" font-weight="700" text-anchor="middle">对照：不换坐标，直接对原通道乘 1 和 ½</text>
<text x="258.5" y="315" font-size="15" text-anchor="middle">[6×1, 2×½] = [6, 1]</text>
<text x="34" y="375" font-size="18" font-weight="700">换基后缩小的是两通道的差，不是单独缩小第二个原始通道。</text>
<text x="27" y="423" font-size="15">W＝(1/√2) × [[1,1],[1,−1]]，W⁻¹＝W；真实模型还包含门支、值支和输出带。</text>
</svg>